{{ define "main" }}
<article class="post-page">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{ if not .Date.IsZero }}
    <time class="post-meta" datetime="{{ .Date.Format "2006-01-02T15:04:05-07:00" }}">{{ .Date.Format "2006-01-02" }}</time>
    {{ end }}
  </header>
  <div class="post-body">
    {{ .Content }}
  </div>
  {{ with .Params.original_url }}
  <p class="original-url"><a href="{{ . }}">原文</a></p>
  {{ end }}
</article>
{{ end }}
