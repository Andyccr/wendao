{{ define "main" }}
<article class="post-page">
  <header class="post-header">
    <h1 class="post-title">{{ i18n "nav_archives" }}</h1>
  </header>
  {{ range (where .Site.RegularPages "Section" "posts").GroupByDate "2006" }}
  <section class="archive-year">
    <h2 class="archive-year-title">{{ .Key }}</h2>
    {{ range .Pages }}
    <a class="post-item-link" href="{{ .RelPermalink }}">
      <article class="post-item post-item-compact">
        <h3 class="post-item-title">{{ .Title }}</h3>
        <time class="post-item-meta" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      </article>
    </a>
    {{ end }}
  </section>
  {{ end }}
</article>
{{ end }}
